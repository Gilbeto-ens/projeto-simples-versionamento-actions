name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  qualidade:
    name: Lint, types e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: projeto-simples:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
